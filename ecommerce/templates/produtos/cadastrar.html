<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - DuTech</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/produtos.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="formulario">

        <h1>Cadastrar Produto</h1>
        <p>Preencha as informações do novo produto.</p>

        <form method="POST" action="/produtos/cadastrar">

            <label>Nome do Produto</label>
            <input type="text" name="nome" required>

            <label>Descrição</label>
            <textarea name="descricao" rows="5" required></textarea>

            <label>Preço</label>
            <input type="number" step="0.01" name="preco" required>

            <label>Estoque</label>
            <input type="number" name="estoque" required>

            <label>Imagem (URL)</label>
            <input type="text" name="imagem" placeholder="https://site.com/imagem.jpg" required>

            <label>Categoria</label>
            <select name="categoriaId" required>
                <option value="">Selecione</option>
                <option value="1">Notebooks</option>
                <option value="2">Celulares</option>
                <option value="3">Monitores</option>
                <option value="4">Periféricos</option>
                <option value="5">Componentes</option>
            </select>

            <button type="submit">
                Cadastrar Produto
            </button>

        </form>

    </div>

</div>

</body>
</html>
