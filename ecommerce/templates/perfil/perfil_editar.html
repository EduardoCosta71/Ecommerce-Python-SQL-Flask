<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil | DuTech</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil_editar.css') }}">
</head>

<body>

    <header>
        <h1>DuTech</h1>
    </header>

    <main class="container">

        <div class="perfil-card">

            <h2>Editar Perfil</h2>

            <p class="descricao">
                Atualize seus dados pessoais abaixo.
            </p>

            <form method="POST">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="{{ usuario.Nome }}"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ usuario.Email }}"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <button type="submit" class="btn-salvar">
                    Salvar alterações
                </button>

                <a href="{{ url_for('perfil') }}" class="btn-voltar">
                    Voltar ao perfil
                </a>

            </form>

        </div>

    </main>

</body>
</html>
