<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Endereço | DuTech</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil_editar_endereco.css') }}">
</head>

<body>

    <header>
        <h1>DuTech</h1>
    </header>

    <main class="container">

        <div class="endereco-card">

            <h2>Editar Endereço</h2>

            <p class="descricao">
                Atualize seu endereço de entrega.
            </p>

            <!-- Formulário para buscar o CEP -->
            <form method="POST" action="{{ url_for('buscar_cep', endereco_id=endereco_id) }}">

                <div class="campo">
                    <label for="cep">CEP</label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        value="{{ endereco.cep if endereco and endereco.cep else '' }}"
                        placeholder="Digite seu CEP"
                        required
                    >
                </div>

                <button type="submit" class="btn-buscar">
                    Buscar CEP
                </button>

            </form>

            <hr>

            <!-- Formulário para salvar o endereço -->
            <form method="POST" action="{{ url_for('atualizar_perfil_endereco', endereco_id=endereco_id) }}">

                <!-- CEP -->
                <div class="campo">
                    <label for="cep_endereco">CEP</label>

                    <input
                        type="text"
                        id="cep_endereco"
                        name="cep"
                        value="{{ endereco.cep if endereco and endereco.cep else '' }}"
                        placeholder="CEP"
                        required
                    >
                </div>

                <!-- Rua -->
                <div class="campo">
                    <label for="rua">Rua</label>

                    <input
                        type="text"
                        id="rua"
                        name="rua"
                        value="{{ endereco.logradouro if endereco and endereco.logradouro else '' }}"
                        placeholder="Digite o nome da rua"
                        required
                    >
                </div>

                <!-- Número e complemento -->
                <div class="linha">

                    <div class="campo">
                        <label for="numero">Número</label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Nº"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento</label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Casa, apartamento..."
                        >
                    </div>

                </div>

                <!-- Bairro -->
                <div class="campo">
                    <label for="bairro">Bairro</label>

                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        value="{{ endereco.bairro if endereco and endereco.bairro else '' }}"
                        placeholder="Digite seu bairro"
                        required
                    >
                </div>

                <!-- Cidade e estado -->
                <div class="linha">

                    <div class="campo">
                        <label for="cidade">Cidade</label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            value="{{ endereco.localidade if endereco and endereco.localidade else '' }}"
                            placeholder="Digite sua cidade"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            value="{{ endereco.uf if endereco and endereco.uf else '' }}"
                            placeholder="UF"
                            maxlength="2"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="btn-salvar">
                    Salvar endereço
                </button>

                <a href="{{ url_for('perfil') }}" class="btn-voltar">
                    Voltar ao perfil
                </a>

            </form>

        </div>

    </main>

</body>
</html>
