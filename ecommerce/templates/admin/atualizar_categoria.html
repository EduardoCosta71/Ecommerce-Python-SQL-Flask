<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Categoria | DuTech</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/atualizar_categorias_admin.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="admin-container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="admin-logo">
                <h1>DuTech</h1>
                <span>ADMIN</span>
            </div>

            <nav class="menu-admin">
                <a href="{{ url_for('admin') }}">Dashboard</a>
                <a href="{{ url_for('produtos_admin') }}">Produtos</a>
                <a href="{{ url_for('categorias_admin') }}" class="ativo">Categorias</a>
                <a href="{{ url_for('pedidos_admin') }}">Pedidos</a>
                <a href="{{ url_for('usuarios_admin') }}">Usuários</a>
                <a href="#">Mensagens</a>
            </nav>

            <div class="menu-inferior">
                <a href="{{ url_for('home') }}">Voltar para loja</a>
                <a href="/usuarios/logout">Sair</a>
            </div>

        </aside>

        <!-- CONTEÚDO -->
        <main class="conteudo">

            <div class="container-editar">

                <div class="topo-editar">
                    <h2>Editar Categoria</h2>
                    <p>Atualize as informações da categoria cadastrada.</p>
                </div>

                <div class="formulario-categoria">

                    <form method="POST"
                          action="{{ url_for('atualizar_categoria', categoria_id=categoria.Id) }}">

                        <div class="campo-formulario">
                            <label for="id">ID da categoria</label>
                            <input
                                type="text"
                                id="id"
                                value="{{ categoria.Id }}"
                                disabled
                            >
                            <small>O ID da categoria não pode ser alterado.</small>
                        </div>

                        <div class="campo-formulario">
                            <label for="nome">Nome da categoria</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                value="{{ categoria.Nome }}"
                                placeholder="Digite o nome da categoria"
                                maxlength="100"
                                required
                            >
                        </div>

                        <div class="botoes-formulario">

                            <a href="{{ url_for('categorias_admin') }}"
                               class="btn-voltar">
                                Cancelar
                            </a>

                            <button type="submit" class="btn-salvar">
                                Salvar alterações
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
