<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Dashboard</title>
</head>
<body>

    <h1>Dashboard</h1>
    <h2>Produtos</h2>
    <p>Lista de produtos:</p>
    <ul>
        {% for produto in produtos %}
            <li>{{ produto[1] }} - R$ {{ "%.2f"|format(produto[2]) }}</li>
        {% endfor %}
    </ul>
</body>
</html>
